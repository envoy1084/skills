min_version: 2.1.0

pre-commit:
  jobs:
    - name: format
      glob: "*.{ts,tsx,js,jsx,mjs,json,md}"
      run: pnpm exec dprint fmt --allow-no-files {staged_files}
      stage_fixed: true
    - name: lint
      glob: "*.{ts,tsx,js,jsx,mjs}"
      run: pnpm exec oxlint --deny-warnings {staged_files}

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-push:
  jobs:
    - name: check
      run: pnpm lint && pnpm typecheck && pnpm test
