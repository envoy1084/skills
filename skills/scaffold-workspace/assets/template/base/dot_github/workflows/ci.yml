# Pull requests, pushes to main, the merge queue and manual runs. Each job runs one stage of
# `pnpm check`, so a failure names the stage; tests also run on the oldest supported Node.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Static
    # @@publish
    # GitHub does not run workflows on PRs the workflow token opens: the version PR is checked by
    # dispatching CI on its branch, and again by the release before publishing.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'github-actions[bot]' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      github.head_ref != 'changeset-release/main'
    # @@end
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: pnpm
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm circular
      # @@publish
      - run: pnpm docs:check
      - name: Require generated barrels to be committed
        run: |
          pnpm codegen
          git diff --exit-code -- packages
      # @@end

  types:
    name: Types
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: pnpm
      - run: pnpm typecheck:tsc
      # @@publish
      - run: pnpm test:types
      # @@end

  build:
    name: Build
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: pnpm
      - run: pnpm build
      # @@publish
      - run: pnpm check:dist
      - run: pnpm pack:check
      # @@end

  test:
    name: Test (Node ${{ matrix.node || 'from .node-version' }})
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Empty uses .node-version; 22.19.0 is the oldest Node the packages support (`engines`).
        node: ["", "22.19.0"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: pnpm
          node-version: ${{ matrix.node }}
      - run: pnpm test
      # @@publish
      - run: pnpm test:docs
      # @@end

  zizmor:
    name: Workflow audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Annotations instead of code scanning: SARIF uploads would need `security-events: write`.
      - uses: zizmorcore/zizmor-action@v0.8.1
        with:
          version: 1.32.0
          config: .github/zizmor.yml
          advanced-security: false
          annotations: true
