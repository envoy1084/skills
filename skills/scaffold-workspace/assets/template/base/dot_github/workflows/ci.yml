# Pull requests, pushes to main, the merge queue and manual runs: formatting, lint, types, builds
# and tests (and package metadata when the repository publishes), plus a security audit of the
# workflows.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # @@publish
    # The version PR only changes versions and changelogs, and GitHub does not run workflows on
    # PRs the workflow token opens; dispatch CI on its branch to check it.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'github-actions[bot]' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      github.head_ref != 'changeset-release/main'
    # @@end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: pnpm
      - run: pnpm check
      # @@publish
      - run: pnpm pack:check
      # @@end

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Annotations instead of code scanning: SARIF uploads would need `security-events: write`.
      - uses: zizmorcore/zizmor-action@v0.8.1
        with:
          version: 1.32.0
          config: .github/zizmor.yml
          advanced-security: false
          annotations: true
